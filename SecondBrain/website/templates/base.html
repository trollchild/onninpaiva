{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>{% block title %}Ravintola Onnin Päivä{% endblock %}</title>

    <meta name="description"
          content="{% block description %}Live music, karaoke, billiards & cocktails in Littoinen{% endblock %}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="{% static 'styles.css' %}">

    {% block extra_css %}{% endblock %}
</head>

<body>

<div class="flames-left"></div>
<div class="flames-right"></div>

{% include 'includes/navbar.html' %}

{% block content %}
{% endblock %}

{% include 'includes/footer.html' %}

<script src="{% static 'script.js' %}"></script>

{% block extra_js %}{% endblock %}
</body>
</html>
